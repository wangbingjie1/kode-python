version: '3.8'

services:
  # PostgreSQL 数据库（生产环境推荐）
  postgres:
    image: postgres:15-alpine
    container_name: kode-postgres
    environment:
      POSTGRES_DB: kode
      POSTGRES_USER: kode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kode_password_change_me}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kode"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kode-network
    restart: unless-stopped

  # Redis（缓存和会话存储）
  redis:
    image: redis:7-alpine
    container_name: kode-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password_change_me}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - kode-network
    restart: unless-stopped

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kode-backend
    environment:
      # 数据库配置
      DATABASE_URL: postgresql+asyncpg://kode:${POSTGRES_PASSWORD:-kode_password_change_me}@postgres:5432/kode

      # Redis 配置
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_change_me}@redis:6379/0

      # AI API Keys（必须设置）
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?请在 .env 文件中设置 ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # OAuth 配置（Google 登录）
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8001/api/auth/google/callback}

      # Stripe 配置
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      # 安全配置
      SECRET_KEY: ${SECRET_KEY:-change_this_secret_key_in_production}

      # 应用配置
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    volumes:
      - ./schema_store:/app/schema_store
      - ./ontology_store:/app/ontology_store
      - ./logs:/app/logs
      - ./kode.db:/app/kode.db  # SQLite fallback
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kode-network
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ../web-frontend
      dockerfile: Dockerfile
    container_name: kode-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - kode-network
    restart: unless-stopped

  # Nginx 反向代理（可选，用于生产环境）
  nginx:
    image: nginx:1.25-alpine
    container_name: kode-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # SSL 证书目录
    ports:
      - "443:443"
      - "8080:80"
    depends_on:
      - frontend
      - backend
    networks:
      - kode-network
    restart: unless-stopped
    profiles:
      - production  # 仅在生产模式启动

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kode-network:
    driver: bridge
