# 开发环境 Docker Compose 配置
# 使用方式: docker-compose -f docker-compose.dev.yml up

version: '3.8'

services:
  # 仅启动数据库和 Redis，后端和前端在宿主机运行
  postgres:
    image: postgres:15-alpine
    container_name: kode-postgres-dev
    environment:
      POSTGRES_DB: kode_dev
      POSTGRES_USER: kode
      POSTGRES_PASSWORD: kode_dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kode"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kode-dev-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kode-redis-dev
    command: redis-server --requirepass kode_dev_redis
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - kode-dev-network
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  kode-dev-network:
    driver: bridge
