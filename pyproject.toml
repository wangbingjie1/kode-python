[tool.poetry]
name = "kode"
version = "0.1.0"
description = "AI-native coding assistant powered by LangChain - Python port of Kode"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "kode"}]

[tool.poetry.dependencies]
python = "^3.10"
packaging = "^23.2"
langchain = "^0.1.0"
langchain-anthropic = "^0.1.0"
langchain-openai = "^0.0.5"
langchain-community = "^0.0.20"
pydantic = "^2.5.0"
rich = "^13.7.0"
typer = "^0.9.0"
prompt-toolkit = "^3.0.43"
pyyaml = "^6.0.1"
aiofiles = "^23.2.1"
watchdog = "^4.0.0"
gitpython = "^3.1.40"
# Web dependencies
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
websockets = "^12.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
aiosqlite = "^0.19.0"
alembic = "^1.13.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.12.1"
ruff = "^0.1.9"
mypy = "^1.8.0"
ipython = "^8.19.0"

[tool.poetry.scripts]
kode = "kode.cli.main:app"
kode-web = "kode.web.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"