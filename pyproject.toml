[tool.poetry]
name = "kode"
version = "0.1.0"
description = "AI-native coding assistant powered by LangChain - Python port of Kode"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "kode"}]

[tool.poetry.dependencies]
python = "^3.10"
packaging = "^23.2"

# AI and LangChain
langchain = "^0.3.0"
langchain-anthropic = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-community = "^0.3.0"
langchain-core = "^0.3.0"
anthropic = "^0.74.0"
pydantic = "^2.10.0"

# Core utilities
pyyaml = "^6.0.1"
aiofiles = "^23.2.1"
watchdog = "^4.0.0"
gitpython = "^3.1.40"
python-dotenv = "^1.0.0"

# Web dependencies
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
websockets = "^12.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
aiosqlite = "^0.19.0"
alembic = "^1.13.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
authlib = "^1.6.0"
httpx = "^0.28.0"
httpx-sse = "^0.4.0"
starlette = "^0.36.0"

# Database drivers for multi-DB support
asyncpg = "^0.30.0"
aiomysql = "^0.3.0"
pymysql = "^1.1.0"
pyodbc = "^5.0.0"

# Ontology and vector embeddings
chromadb = "^1.3.0"
sentence-transformers = "^3.0.0"
rdflib = "^7.0.0"

# Stripe billing
stripe = "^11.0.0"

# Token counting
tiktoken = "^0.8.0"

# Task queue (optional for background tasks)
celery = "^5.6.0"
redis = "^5.0.0"

# Data processing
beautifulsoup4 = "^4.12.0"

# Document processing
pdfplumber = "^0.10.0"
python-docx = "^1.1.0"
openpyxl = "^3.1.0"
chardet = "^5.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.12.1"
ruff = "^0.1.9"
mypy = "^1.8.0"
ipython = "^8.19.0"

[tool.poetry.scripts]
kode = "kode.web.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"